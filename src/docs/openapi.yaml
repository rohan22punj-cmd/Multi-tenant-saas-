          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: "error"
                statusCode: 404
                message: "Role not found"
        '409':
          description: Cannot demote the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: "error"
                statusCode: 409
                message: "Cannot demote the last admin"

