      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum: [success]
                  data:
                    type: object
                    required:
                      - id
                      - roleId
                      - roleName
                    properties:
                      id:
                        type: string
                        format: uuid
                      roleId:
                        type: string
                        format: uuid
                      roleName:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
