  /api/users/{id}/deactivate:
    patch:
      tags: [Users]
      summary: Deactivate a user
      description: |
        Sets isActive=false and clears refreshTokenHash (cuts off future logins).
        Access token stays valid for up to 15 min (stateless trade-off).
        Guards:
        - Cannot deactivate yourself (403)
        - Cannot deactivate the last active admin (409)
        - Cannot deactivate someone with permissions you don't have (403)
        **Permission**: `user:manage`
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateResponse'
        '400':
          description: Invalid ObjectId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: "error"
                statusCode: 400
                message: "Invalid user id"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot deactivate the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: "error"
                statusCode: 409
                message: "Cannot deactivate the last admin"

  /api/users/{id}/reactivate:
    patch:
      tags: [Users]
      summary: Reactivate a user
      description: |
        Sets isActive=true. Idempotent — already-active users return 200.
