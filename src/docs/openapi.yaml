  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role
      description: |
        Changes the user's roleId and clears refreshTokenHash (forces re-login
        to get new permissions). Guards:
        - Cannot change your own role (403)
        - Cannot assign a role with permissions you don't have (403)
        - Cannot change someone who has permissions you don't have (403)
        - Cannot demote the last active admin (409)
        - Idempotent: if already has that role, returns 200
        **Permission**: `user:manage`
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
